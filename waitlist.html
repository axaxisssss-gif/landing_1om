<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the waitlist — 1%oM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>

  :root{
    --color-page: #f2ede4;
    --color-ink: #1c1a17;
    --color-muted: #6f6a62;
    --color-border: #ddd6c9;
    --color-input-bg: #ffffff;
    --color-button: #191919;
    --color-button-text: #f2ede4;
    --font-sans: 'VisueltPro', 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-serif: 'Bradford', 'Fraunces', ui-serif, Georgia, serif;
    --ease: cubic-bezier(0.625, 0.05, 0, 1);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: #FFFEF2;
    color: var(--color-ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding: 40px 20px;
    position:relative;
  }
  .shell{ position:relative; z-index:2; }

  a{ color:inherit; }

  .shell{
    width:100%; max-width: 480px;
    margin: 0 auto;
    padding: 56px 44px 48px;
    background: var(--color-page);
    border: 1px solid var(--color-border);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }

  @media (max-width:560px){
    .shell{ padding: 40px 24px 32px; border-radius:14px; }
  }

  .brand{
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    margin: 0 auto 36px;
    opacity: .92; transition: opacity .2s var(--ease);
  }
  .brand:hover{ opacity:1; }
  .brand svg{ width:96px; height:auto; }

  h1{
    font-family: var(--font-serif); font-style:italic; font-weight:500;
    font-size: 28px;
    letter-spacing: -0.02em; line-height: 1.2;
    margin: 0 0 20px;
    text-align:center;
  }

  .lede{
    font-family: var(--font-sans); font-size:16px; font-weight:400;
    color: var(--color-muted); line-height:1.5; max-width: 38ch;
    margin: 0 auto 44px;
    text-align:center;
  }
  @media (max-width:560px){ .lede{ font-size:14px; } }
  .brk-mobile{ display:none; }
  @media (max-width:560px){ .brk-mobile{ display:block; } }

  form{ display:flex; flex-direction:column; gap: 28px; }

  .field-row{ display:flex; gap: 16px; }
  .field-row .field{ flex:1; min-width:0; }
  @media (max-width:420px){ .field-row{ flex-direction:column; gap:28px; } }

  .field label{
    display:block; font-family: var(--font-sans); font-size:11px; font-weight:500;
    text-transform:uppercase; letter-spacing: 0.05em; color: var(--color-ink);
    margin-bottom: 10px;
  }
  .field input{
    width:100%; padding: 16px 18px;
    background: var(--color-input-bg);
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-family: var(--font-sans); font-size:15px; color: var(--color-ink);
    transition: border-color .2s var(--ease);
  }
  .field input:focus{
    outline:none; border-color: var(--color-ink);
  }
  .field input::placeholder{ color:#b7b1a2; }

  .submit{
    appearance:none; border:none; cursor:pointer;
    background: var(--color-button); color: var(--color-button-text);
    font-family: var(--font-sans); font-size:15px; font-weight:500;
    text-transform:none; letter-spacing: normal;
    padding: 18px 24px; border-radius: 4px;
    transition: background .2s var(--ease), opacity .2s var(--ease);
  }
  .submit:hover{ opacity:.9; }
  .submit:disabled{ opacity:.6; cursor:default; }

  .fine{
    margin-top: 28px; text-align:center;
    font-family: var(--font-sans); font-size:13px; color: var(--color-muted); line-height:1.6;
  }
  .fine a{ color: var(--color-muted); text-decoration: underline; text-underline-offset:2px; }
  .fine a:hover{ color: var(--color-ink); }
  .fine .links{ display:block; margin-top: 14px; }
  .fine .links a{ margin-right: 8px; }
  .fine .links span{ margin-right: 8px; color: var(--color-border); }

  /* -------- form / success cross-fade (no hard swap) -------- */
  .form-group{
    transition: opacity .45s var(--ease), transform .45s var(--ease), filter .45s var(--ease);
  }
  .shell.is-leaving .form-group{
    opacity:0; transform: translateY(-10px); filter: blur(6px);
    pointer-events:none;
  }

  .success{
    display:none;
    opacity:0; transform: translateY(16px); filter: blur(6px);
    transition: opacity .6s var(--ease), transform .6s var(--ease), filter .6s var(--ease);
    font-family: var(--font-serif); font-style:italic; font-weight:500;
    font-size: 28px; letter-spacing:-0.02em; line-height:1.2;
    max-width: 30ch;
    text-align:center;
    margin: 0 auto;
  }
  .success .sub{
    display:block; margin-top:14px;
    font-family: var(--font-sans); font-style:normal; font-weight:400; font-size:16px; color: var(--color-muted);
  }
  .success .countdown{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin-top:32px;
  }
  .success .countdown-label{
    font-family: var(--font-sans); font-style:normal; font-weight:400; font-size:13px;
    letter-spacing:0.01em; text-transform:none; color: var(--color-muted);
  }
  .success .countdown-num{
    position:relative;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-serif); font-style:italic; font-weight:500;
    font-size:20px; color: var(--color-ink);
    border:1px solid var(--color-border); border-radius:50%;
    transition: opacity .25s var(--ease), transform .25s var(--ease);
  }
  .success .countdown-num.tick{
    opacity:0; transform: scale(.7);
  }
  @media (prefers-reduced-motion: reduce){
    .success .countdown-num{ transition:none !important; }
  }
  .shell.is-success .form-group{ display:none; }
  .shell.is-success .success{ display:block; }
  .shell.is-entered .success{ opacity:1; transform:translateY(0); filter:blur(0); }

  @media (prefers-reduced-motion: reduce){
    .form-group, .success{ transition:none !important; filter:none !important; }
  }

</style>
</head>

<script>
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LANDING_URL = '1percentofmiracle-landing-v7-final.html';

  function startRedirectCountdown(){
    var numEl = document.getElementById('countdown-num');
    var n = 3;
    var timer = setInterval(function(){
      n -= 1;
      if(n > 0){
        numEl.classList.add('tick');
        setTimeout(function(){
          numEl.textContent = n;
          numEl.classList.remove('tick');
        }, 250);
      } else {
        clearInterval(timer);
        numEl.classList.add('tick');
        setTimeout(function(){ window.location.href = LANDING_URL; }, 250);
      }
    }, 1000);
  }

  document.getElementById('waitlist-form').addEventListener('submit', function(e){
    e.preventDefault();
    var shell = document.getElementById('shell');
    if(reduceMotion){
      shell.classList.add('is-success', 'is-entered');
      startRedirectCountdown();
      return;
    }
    shell.classList.add('is-leaving');
    setTimeout(function(){
      shell.classList.add('is-success');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ shell.classList.add('is-entered'); });
      });
      startRedirectCountdown();
    }, 450);
  });
</script>

</body>
</html>
